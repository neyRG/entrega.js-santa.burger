<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>santa burger</title>
    <link rel="stylesheet" href="./style/style.css" />
    <script src="./script/main.js"></script>
  </head>
  <body>
    <header>
      <nav class="inicio" aria-label="Navegación principal">
        <h1 class="tex1">La Santa <span class="tex2">Burger</span></h1>
        <a href="#inicio">Inicio</a>
        <a href="#menu">Menú</a>
        <a href="#nosotros">Nosotros</a>
      </nav>
      <img id="inicio" class="imgfood" src="./assets/img/img-inicio.png" alt="" />
      <div class="hero-content">
        <!--<p class="hero-eyebrow">La Santa Burger</p> -->
        <h2>El sabor que<br />enciende tus ganas.</h2>
        <a class="hero-button" href="#menu">Descubre el menú</a>
      </div>
    </header>
    <main>
      <section id="menu" class="menu-section">
        <p class="section-eyebrow">Recién salidos de la cocina</p>
        <h2>Los santos <span class="tex2">combos</span></h2>
        <div class="carousel" aria-label="Carrusel del menú">
          <div class="carousel-viewport" tabindex="0" aria-label="Combos; desplázate horizontalmente para ver más">
            <div class="carousel-track">
              <article class="menu-card">
                <img src="/assets/img/combos/simple%20bacon%20chedar.JPG" alt="Hamburguesa Simple Bacon Cheddar" />
                <h3>Simple Bacon Cheddar</h3>
              </article>
              <article class="menu-card">
                <img src="/assets/img/combos/simple%20para%202.JPG" alt="Combo Simple para 2" />
                <h3>Simple para 2</h3>
              </article>
              <article class="menu-card">
                <img src="/assets/img/combos/santa%20bacon%20chedar.JPG" alt="Hamburguesa Santa Bacon Cheddar" />
                <h3>Santa Bacon Cheddar</h3>
              </article>
              <article class="menu-card">
                <img src="/assets/img/combos/samta%20doble%20deceo%20.JPG" alt="Hamburguesa Santa Doble Deseo" />
                <h3>Santa Doble Deseo</h3>
              </article>
              <article class="menu-card">
                <img src="/assets/img/combos/la%20santa%20y%20tentacion%20.JPG" alt="Combo La Santa y Tentación" />
                <h3>La Santa y Tentación</h3>
              </article>
              <article class="menu-card">
                <img src="/assets/img/combos/doble%20tentacion%20.JPG" alt="Hamburguesa Doble Tentación" />
                <h3>Doble Tentación</h3>
              </article>
              <article class="menu-card">
                <img src="/assets/img/combos/combos.JPG" alt="Combos de La Santa Burger" />
                <h3>Combos</h3>
              </article>
            </div>
          </div>
        </div>
        <h2 class="gallery-heading">Menú de las <span class="tex2">santas</span></h2>
        <div class="menu-gallery" aria-label="Fotos de las hamburguesas del menú">
          <figure class="gallery-item">
            <img src="/assets/img/la%20santa.JPG" alt="Hamburguesa La Santa" loading="lazy" />
            <figcaption>La Santa</figcaption>
          </figure>
          <figure class="gallery-item">
            <img src="/assets/img/santa%20tentacion.JPG" alt="Hamburguesa Santa Tentación" loading="lazy" />
            <figcaption>Santa Tentación</figcaption>
          </figure>
          <figure class="gallery-item">
            <img src="/assets/img/samta%20doble.JPG" alt="Hamburguesa Santa Doble" loading="lazy" />
            <figcaption>Santa Doble</figcaption>
          </figure>
          <figure class="gallery-item">
            <img src="/assets/img/santa%20doble%20bacon.JPG" alt="Hamburguesa Santa Doble Bacon" loading="lazy" />
            <figcaption>Santa Doble Bacon</figcaption>
          </figure>
          <figure class="gallery-item">
            <img src="/assets/img/doble%20tentacion.JPG" alt="Hamburguesa Doble Tentación" loading="lazy" />
            <figcaption>Doble Tentación</figcaption>
          </figure>
        </div>
      </section>
    </main>
    <footer>La Santa Burger</footer>
  </body>
  
</html>
